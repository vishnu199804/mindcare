<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MindCare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white shadow-lg rounded-xl p-8 w-full max-w-md">
        <div class="text-center mb-6">
            <i class="fas fa-brain text-indigo-600 text-4xl"></i>
            <h2 class="text-2xl font-bold text-gray-800 mt-2">Welcome Back</h2>
            <p class="text-gray-600 text-sm">Login to continue your wellness journey</p>
        </div>

        <form method="POST">
            {% csrf_token %}

            <label class="block mb-2 text-gray-700 font-medium">Username</label>
            <input type="text" name="username" required
                   class="w-full px-4 py-3 mb-4 border rounded-lg focus:ring-2 focus:ring-indigo-400">

            <label class="block mb-2 text-gray-700 font-medium">Password</label>
            <input type="password" name="password" required
                   class="w-full px-4 py-3 mb-6 border rounded-lg focus:ring-2 focus:ring-indigo-400">

            <button class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition">
                Login
            </button>
        </form>

        <p class="mt-4 text-center text-gray-600">
            Don’t have an account?
            <a href="{% url 'signup' %}" class="text-indigo-600 hover:underline font-semibold">Register</a>
        </p>
    </div>

</body>
</html>

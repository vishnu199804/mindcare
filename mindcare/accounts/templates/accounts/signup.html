<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - MindCare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white shadow-lg rounded-xl p-8 w-full max-w-md">
        <div class="text-center mb-6">
            <i class="fas fa-brain text-indigo-600 text-4xl"></i>
            <h2 class="text-2xl font-bold text-gray-800 mt-2">Create an Account</h2>
            <p class="text-gray-600 text-sm">Join MindCare to improve your mental wellness</p>
        </div>

        <form method="POST">
            {% csrf_token %}

            <label class="block mb-2 text-gray-700 font-medium">Username</label>
            <input type="text" name="username" required
                   class="w-full px-4 py-3 mb-4 border rounded-lg focus:ring-2 focus:ring-indigo-400">

            <label class="block mb-2 text-gray-700 font-medium">Email</label>
            <input type="email" name="email" required
                   class="w-full px-4 py-3 mb-4 border rounded-lg focus:ring-2 focus:ring-indigo-400">

            <label class="block mb-2 text-gray-700 font-medium">Password</label>
            <input type="password" name="password" required
                   class="w-full px-4 py-3 mb-4 border rounded-lg focus:ring-2 focus:ring-indigo-400">

            <label class="block mb-2 text-gray-700 font-medium">Register As</label>
            <select name="role" class="w-full px-4 py-3 mb-6 border rounded-lg text-gray-700 focus:ring-2 focus:ring-indigo-400">
                <option value="patient">Patient</option>
                <option value="doctor">Doctor</option>
            </select>

            <button class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition">
                Sign Up
            </button>
        </form>

        <p class="mt-4 text-center text-gray-600">
            Already have an account?
            <a href="{% url 'login' %}" class="text-indigo-600 hover:underline font-semibold">Login</a>
        </p>
    </div>

</body>
</html>

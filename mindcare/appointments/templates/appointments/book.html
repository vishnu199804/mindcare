<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Appointment | MindCare</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-blue-50 to-purple-50 min-h-screen flex items-center justify-center">

    <div class="bg-white shadow-2xl rounded-2xl p-10 max-w-lg w-full">

        <!-- Header -->
        <div class="text-center mb-8">
            <div class="mx-auto mb-4 flex items-center justify-center w-16 h-16 rounded-full bg-blue-100">
                <span class="text-3xl">📅</span>
            </div>
            <h1 class="text-3xl font-extrabold text-gray-800">
                Book Appointment
            </h1>
            <p class="text-gray-500 mt-2">
                Schedule your consultation with a doctor
            </p>
        </div>

        <!-- Form -->
        <form method="post" class="space-y-6">
            {% csrf_token %}

            <!-- Doctor Select -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    Select Doctor
                </label>
                <select name="doctor" required
                        class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    {% for doctor in doctors %}
                        <option value="{{ doctor.id }}">
                            Dr. {{ doctor.username }}
                        </option>
                    {% empty %}
                        <option disabled>No doctors available</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Date & Time -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    Date & Time
                </label>
                <input type="datetime-local" name="date" required
                       class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <!-- Submit Button -->
            <button type="submit"
                    class="w-full py-3 rounded-xl text-white font-semibold text-lg
                           bg-gradient-to-r from-blue-600 to-purple-600
                           hover:from-blue-700 hover:to-purple-700
                           transition transform hover:-translate-y-0.5 shadow-lg">
                Book Appointment
            </button>
        </form>

        <!-- Back Button -->
        <div class="text-center mt-6">
            <a href="{% url 'patient_dashboard' %}"
               class="text-blue-600 hover:underline font-medium">
                ← Back to Dashboard
            </a>
        </div>

    </div>

</body>
</html>

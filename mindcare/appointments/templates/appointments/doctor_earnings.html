<!DOCTYPE html>
<html>
<head>
    <title>Doctor Earnings</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-8">

<div class="max-w-5xl mx-auto bg-white rounded-xl shadow p-6">
    <h1 class="text-2xl font-bold mb-4">💰 Earnings</h1>

    <p class="mb-4 text-lg">
        Total Earnings:
        <span class="font-bold text-green-600">₹{{ total_earnings }}</span>
    </p>

    <table class="w-full border-collapse">
        <tr class="bg-gray-100 border-b">
            <th class="p-3 text-left">Patient</th>
            <th class="p-3 text-left">Date</th>
            <th class="p-3 text-left">Amount</th>
        </tr>

        {% for a in appointments %}
        <tr class="border-b">
            <td class="p-3">{{ a.patient.username }}</td>
            <td class="p-3">{{ a.date }}</td>
            <td class="p-3 text-green-600 font-semibold">₹500</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3" class="p-4 text-center text-gray-500">
                No earnings yet
            </td>
        </tr>
        {% endfor %}
    </table>

    <a href="{% url 'doctor_dashboard' %}"
       class="inline-block mt-6 text-blue-600">
        ← Back to Dashboard
    </a>
</div>

</body>
</html>

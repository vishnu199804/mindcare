<!DOCTYPE html>
<html>
<head>
    <title>Doctor Prescriptions</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen p-8">

<div class="max-w-7xl mx-auto bg-white shadow-xl rounded-xl p-6">

    <h1 class="text-2xl font-bold mb-6 flex items-center gap-2">
        📄 Doctor Prescriptions
    </h1>

    <table class="w-full border-collapse">
        <thead>
            <tr class="bg-gray-100 text-left text-sm uppercase text-gray-600">
                <th class="p-3">Patient</th>
                <th class="p-3">Date</th>
                <th class="p-3">Status</th>
                <th class="p-3 text-center">Actions</th>
            </tr>
        </thead>

        <tbody>
        {% for p in prescriptions %}
            <tr class="border-b hover:bg-gray-50">
                <td class="p-3 font-semibold">
                    {{ p.patient.username }}
                </td>

                <td class="p-3 text-gray-600">
                    {{ p.date }}
                </td>

                <td class="p-3">
                    <span class="px-3 py-1 rounded-full text-xs bg-green-100 text-green-700">
                        Completed
                    </span>
                </td>

                <td class="p-3 text-center space-x-2">

                    <a href="{% url 'view_prescription' p.id %}"
                       class="px-3 py-1 bg-blue-600 text-white rounded hover:bg-blue-700">
                        View
                    </a>

                    <a href="{% url 'edit_prescription' p.id %}"
                       class="px-3 py-1 bg-yellow-500 text-white rounded hover:bg-yellow-600">
                        Edit
                    </a>

                    <a href="{% url 'download_redirect' p.id %}"
                       class="px-3 py-1 bg-green-600 text-white rounded hover:bg-green-700">
                        PDF
                    </a>

                </td>
            </tr>
        {% empty %}
            <tr>
                <td colspan="4" class="p-6 text-center text-gray-500">
                    No prescriptions found
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>

    <a href="{% url 'doctor_dashboard' %}"
       class="inline-block mt-6 bg-gray-700 text-white px-6 py-2 rounded-lg">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>

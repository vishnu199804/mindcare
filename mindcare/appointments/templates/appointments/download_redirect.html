<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Downloading Prescription</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center">

<div class="bg-white shadow-2xl rounded-2xl p-10 w-full max-w-md text-center">

    <div class="flex justify-center mb-6">
        <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-3xl">
            ⬇️
        </div>
    </div>

    <h1 class="text-2xl font-bold text-gray-800 mb-2">
        Download Ready
    </h1>

    <p class="text-gray-600 mb-6">
        Your prescription PDF will open in a new tab.<br>
        You will be redirected automatically.
    </p>

    <!-- REAL DOWNLOAD BUTTON -->
    <a href="{% url 'prescription_pdf' %}"
       target="_blank"
       class="inline-block bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl font-semibold shadow transition">
        ⬇️ Download PDF
    </a>

    <p class="text-sm text-gray-500 mt-6">
        Redirecting to dashboard...
    </p>
</div>

<script>
    setTimeout(function () {
        window.location.href = "{% url 'patient_dashboard' %}";
    }, 3000);
</script>

</body>
</html>

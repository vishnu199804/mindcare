<!DOCTYPE html>
<html>
<head>
    <title>Edit Prescription</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

<div class="bg-white rounded-xl shadow-xl p-8 w-full max-w-xl">

    <h2 class="text-2xl font-bold mb-6">✏️ Edit Prescription</h2>

    <form method="POST">
        {% csrf_token %}

        <label class="block mb-2">Age</label>
        <input name="patient_age" value="{{ appointment.patient_age }}"
               class="w-full border p-2 rounded mb-4">

        <label class="block mb-2">Weight</label>
        <input name="patient_weight" value="{{ appointment.patient_weight }}"
               class="w-full border p-2 rounded mb-4">

        <label class="block mb-2">Diagnosis</label>
        <textarea name="diagnosis" rows="3"
                  class="w-full border p-2 rounded mb-4">{{ appointment.diagnosis }}</textarea>

        <label class="block mb-2">Medicines</label>
        <textarea name="medicines" rows="4"
                  class="w-full border p-2 rounded mb-4">{{ appointment.medicines }}</textarea>

        <label class="block mb-2">Advice</label>
        <textarea name="advice" rows="3"
                  class="w-full border p-2 rounded mb-4">{{ appointment.advice }}</textarea>

        <div class="flex justify-between">
            <a href="{% url 'doctor_prescriptions' %}"
               class="text-gray-600">Cancel</a>

            <button type="submit"
                    class="bg-indigo-600 text-white px-6 py-2 rounded">
                Save
            </button>
        </div>
    </form>

</div>

</body>
</html>

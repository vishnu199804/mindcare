<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Patient Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-blue-50">
    <div class="max-w-5xl mx-auto py-10">
        <h1 class="text-3xl font-bold mb-6">🧑‍⚕️ Patient Dashboard</h1>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">

            <a href="#" class="p-6 bg-white shadow rounded-xl hover:bg-blue-100">
                <h2 class="text-lg font-bold">📅 Book Appointment</h2>
                <p class="text-gray-600">Book a session with the doctor.</p>
            </a>

            <a href="#" class="p-6 bg-white shadow rounded-xl hover:bg-green-100">
                <h2 class="text-lg font-bold">💳 Make Payment</h2>
                <p class="text-gray-600">Complete your consultation fee.</p>
            </a>

            <a href="#" class="p-6 bg-white shadow rounded-xl hover:bg-purple-100">
                <h2 class="text-lg font-bold">🎥 Join Video Call</h2>
                <p class="text-gray-600">Attend your consultation meeting.</p>
            </a>

            <a href="#" class="p-6 bg-white shadow rounded-xl hover:bg-orange-100">
                <h2 class="text-lg font-bold">📄 Download Prescription</h2>
                <p class="text-gray-600">View and download your prescriptions.</p>
            </a>

        </div>
    </div>
</body>
</html>

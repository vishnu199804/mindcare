<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Doctor Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">
    <div class="max-w-5xl mx-auto py-10">
        <h1 class="text-3xl font-bold mb-6">👨‍⚕️ Doctor Dashboard</h1>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">

            <a href="#" class="p-6 bg-white shadow rounded-xl hover:bg-blue-50">
                <h2 class="text-lg font-bold">📅 View Appointments</h2>
                <p class="text-gray-600">Check all patient bookings.</p>
            </a>

            <a href="#" class="p-6 bg-white shadow rounded-xl hover:bg-green-50">
                <h2 class="text-lg font-bold">💰 Payment Status</h2>
                <p class="text-gray-600">See paid & pending payments.</p>
            </a>

            <a href="#" class="p-6 bg-white shadow rounded-xl hover:bg-purple-50">
                <h2 class="text-lg font-bold">🎥 Start Video Call</h2>
                <p class="text-gray-600">Join meeting with the patient.</p>
            </a>

            <a href="#" class="p-6 bg-white shadow rounded-xl hover:bg-orange-50">
                <h2 class="text-lg font-bold">✍️ Write Prescription</h2>
                <p class="text-gray-600">Create prescription for patient.</p>
            </a>

        </div>
    </div>
</body>
</html>
